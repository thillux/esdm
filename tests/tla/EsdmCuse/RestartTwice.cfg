\* Pollers for POLLIN and POLLOUT while the server exits and starts twice
\* PollReadable is left out: the exit is a suspend notification, which reports POLLIN by design (Suspend) until the poll checker acted on it, also after the next server started
\* Slow
CONSTANTS
    Urandom = FALSE
    PollIn = {"p1"}
    PollOut = {"o1"}
    Probe = {}
    Readers = {}
    NbReaders = {}
    Ioctls = {}
    Signalled = {}
    Workers = {"k1"}
    StartOp = FALSE
    KernelReady = TRUE
    OpChanges = 0
    NeedChanges = 0
    SpentChanges = 0
    SrvChanges = 4
    Kills = 0
    Suspends = 0
    RestartOp = {FALSE, TRUE}
    RestartNeed = {FALSE, TRUE}
    HonorNonblock = TRUE
    KeepNullPh = TRUE
    PollFallback = TRUE
    UrandomNoSwitch = TRUE
    PostAfterPublish = TRUE
    SuspendGen = TRUE
    RecheckGen = TRUE
    defaultInitValue = "undef"
SPECIFICATION Spec
INVARIANTS
    TypeOK
    WaiterCovered
    NonblockNeverWaits
    UrandomFallback
    InterruptNotStuck
