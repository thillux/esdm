\* One task thread for two DRNGs: reseeds that fall due again and again keep the initial DRNG from being brought up
\* Expect: BringupNotStarved
\* Witness: task = \[t1 \|-> 1\]
\* The witness: a reseed of the node DRNG on the task thread
CONSTANTS
    NN = 2
    Req = {"r1"}
    ReqKinds = {"full"}
    ReqSizes = {2}
    PRSizes = {2}
    SS = 2
    InitAdd = 0
    Osr = 0
    ES = {"jent"}
    Jent = "jent"
    Yield = {0, 2}
    Ntg1 = FALSE
    JentNtg1 = FALSE
    NtgMin = 0
    Budgeted = TRUE
    MaxBits = 4
    ThreshBits = 3
    Worker = TRUE
    Tasks = {"t1"}
    Monitor = FALSE
    MaxResets = 0
    MaxForces = 0
    MaxDue = 0
    AnyDue = TRUE
    InjectFail = FALSE
    FullRetry = TRUE
    PRWaitInit = TRUE
    CreditFailed = FALSE
    PerRequest = FALSE
    ResetEsFirst = TRUE
    ResetEpoch = TRUE
    PartialResets = FALSE
    Liveness = TRUE
    \* A model value: fairness compares the variables before and after a
    \* step, also a parameter not yet set with its boolean value
    defaultInitValue = undef
SPECIFICATION LiveSpec
CHECK_DEADLOCK TRUE
PROPERTIES
    BringupNotStarved
