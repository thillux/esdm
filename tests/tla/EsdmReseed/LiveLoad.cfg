\* One task thread for two DRNGs: requests that use up the initial DRNG again and again keep the node DRNG from being brought up
\* Expect: SeededUnderLoad
\* Witness: task = \[t1 \|-> 0\]
\* The witness: a reseed of the initial DRNG on the task thread
CONSTANTS
    NN = 2
    Req = {"r1"}
    ReqKinds = {"nb"}
    ReqSizes = {2}
    PRSizes = {2}
    SS = 2
    InitAdd = 0
    Osr = 0
    ES = {"jent"}
    Jent = "jent"
    Yield = {0, 2}
    Ntg1 = FALSE
    JentNtg1 = FALSE
    NtgMin = 0
    Budgeted = TRUE
    MaxBits = 2
    ThreshBits = 1
    Worker = TRUE
    Tasks = {"t1"}
    Monitor = FALSE
    MaxResets = 0
    MaxForces = 0
    MaxDue = 0
    AnyDue = FALSE
    InjectFail = FALSE
    FullRetry = TRUE
    PRWaitInit = TRUE
    CreditFailed = FALSE
    PerRequest = FALSE
    ResetEsFirst = TRUE
    ResetEpoch = TRUE
    WaitRetry = TRUE
    PartialResets = FALSE
    Liveness = TRUE
    \* A model value: fairness compares the variables before and after a
    \* step, also a parameter not yet set with its boolean value
    defaultInitValue = undef
SPECIFICATION LiveSpec
CHECK_DEADLOCK TRUE
PROPERTIES
    SeededUnderLoad
