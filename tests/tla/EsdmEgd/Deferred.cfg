\* A blocking read deferred with a request pipelined behind it, beside a privileged command; clients close at any time
CONSTANTS
    Clients = {"a", "b"}
    PrClients = {}
    Root = {"b"}
    Streamers = {}
    Script <- SDeferred
    BufCmds = 2
    SqCap = 2
    SndBuf = 1
    MaxEvents = 3
    Cap = 2
    ClientClose = TRUE
    HalfClose = TRUE
    GenFail = FALSE
    AcceptFail = FALSE
    Stall = FALSE
    NoSignal = TRUE
    KeepArmed = FALSE
    Block = {}
    FixHangup = TRUE
    FixEpipe = TRUE
    FixFair = TRUE
    FixRdhup = TRUE
    FixAccept = TRUE
    FixCap = TRUE
    Liveness = FALSE
    defaultInitValue = "undef"
SPECIFICATION Spec
INVARIANTS
    TypeOK
    WorkerNeverBlocks
    ArmedRight
    DeferredState
    NoUseAfterFree
    InOrder
    FullAnswer
    PrivOnlyRoot
    ContentOK
    NoBypass
    OneResponse
    NoLoss
    NoDrop
    NoSpin
    NoSigpipe
PROPERTIES
    Reclaimed
