\* The setting of Park with its liveness: the connection of every client that is gone is closed, whatever the generators do
\* Slow
CONSTANTS
    Clients = {"a", "b"}
    PrClients = {"b"}
    Root = {"b"}
    Streamers = {}
    Script <- SPark
    BufCmds = 2
    SqCap = 2
    SndBuf = 1
    MaxEvents = 3
    Cap = 2
    ClientClose = TRUE
    HalfClose = TRUE
    GenFail = TRUE
    AcceptFail = FALSE
    Stall = TRUE
    NoSignal = TRUE
    KeepArmed = FALSE
    Block = {}
    FixHangup = TRUE
    FixEpipe = TRUE
    FixFair = TRUE
    FixRdhup = TRUE
    FixAccept = TRUE
    FixCap = TRUE
    Liveness = FALSE
    defaultInitValue = "undef"
SPECIFICATION Spec
INVARIANTS
    TypeOK
    WorkerNeverBlocks
    ArmedRight
    DeferredState
    NoUseAfterFree
    InOrder
    FullAnswer
    PrivOnlyRoot
    ContentOK
    NoBypass
    OneResponse
    NoLoss
    NoDrop
    NoSpin
    NoSigpipe
PROPERTIES
    Reclaimed
