\* The setting of Deferred with a recv() that waits: with one recv() per event the worker never meets an empty socket
CONSTANTS
    Clients = {"a", "b"}
    PrClients = {}
    Root = {"b"}
    Streamers = {}
    Script <- SDeferred
    BufCmds = 2
    SqCap = 2
    SndBuf = 1
    MaxEvents = 3
    Cap = 2
    ClientClose = TRUE
    HalfClose = TRUE
    GenFail = FALSE
    AcceptFail = FALSE
    Stall = FALSE
    NoSignal = TRUE
    KeepArmed = FALSE
    Block = {"recv"}
    FixHangup = TRUE
    FixEpipe = TRUE
    FixFair = TRUE
    FixRdhup = TRUE
    FixAccept = TRUE
    FixCap = TRUE
    Liveness = FALSE
    defaultInitValue = "undef"
SPECIFICATION Spec
INVARIANTS
    TypeOK
    WorkerNeverBlocks
    ArmedRight
    DeferredState
    NoUseAfterFree
    InOrder
    FullAnswer
    PrivOnlyRoot
    ContentOK
    NoBypass
    OneResponse
    NoLoss
    NoDrop
    NoSpin
    NoSigpipe
