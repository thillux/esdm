\* A non-blocking read parked for a reseed, then a privileged command, beside a PR blocking read; generations fail, stalled responses are reclaimed
CONSTANTS
    Clients = {"a", "b"}
    PrClients = {"b"}
    Root = {"b"}
    Streamers = {}
    Script <- SPark
    BufCmds = 2
    SqCap = 2
    SndBuf = 1
    MaxEvents = 3
    Cap = 2
    ClientClose = TRUE
    HalfClose = TRUE
    GenFail = TRUE
    AcceptFail = FALSE
    Stall = TRUE
    NoSignal = TRUE
    KeepArmed = FALSE
    FixFair = TRUE
    FixAccept = TRUE
    FixCap = TRUE
    Liveness = FALSE
    defaultInitValue = "undef"
SPECIFICATION Spec
INVARIANTS
    TypeOK
    WorkerNeverBlocks
    ArmedRight
    DeferredState
    NoUseAfterFree
    InOrder
    FullAnswer
    PrivOnlyRoot
    ContentOK
    NoBypass
    OneResponse
    NoLoss
    NoSpin
    NoSigpipe
CHECK_DEADLOCK FALSE
