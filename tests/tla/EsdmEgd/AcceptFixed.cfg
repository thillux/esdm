    Streamers = {}
    Script <- SCnt
    BufCmds = 2
    SqCap = 1
    SndBuf = 1
    MaxEvents = 4
    Cap = 2
    ClientClose = FALSE
    HalfClose = FALSE
    GenFail = FALSE
    AcceptFail = TRUE
    Stall = FALSE
    NoSignal = TRUE
    KeepArmed = FALSE
    FixFair = TRUE
    FixAccept = TRUE
