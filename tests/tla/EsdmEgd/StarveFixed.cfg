    PrClients = {}
    Root = {}
    Streamers = {"s"}
    Script <- SCnt
    BufCmds = 2
    SqCap = 1
    SndBuf = 1
    MaxEvents = 3
    Cap = 2
    ClientClose = FALSE
    HalfClose = FALSE
    GenFail = FALSE
    AcceptFail = FALSE
    Stall = FALSE
    NoSignal = TRUE
    KeepArmed = FALSE
    Block = {}
    FixHangup = TRUE
    FixEpipe = TRUE
    FixFair = TRUE
    FixRdhup = TRUE
    FixAccept = TRUE
    FixCap = TRUE
    Liveness = TRUE
    defaultInitValue = "undef"
SPECIFICATION Spec
