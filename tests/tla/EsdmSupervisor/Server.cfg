\* The server: signals reach the daemon across the fork, none goes to its PID after the reap, a stray termination signal is forwarded and dropped, status mirrored, cleanup once
CONSTANTS
    Sigs = {"TERM", "USR1", "USR2"}
    Fwd = {"TERM", "USR1", "USR2"}
    PreHandlers = {"TERM"}
    PostHandlers = {"USR1"}
    TermSigs = {"TERM"}
    Latch = TRUE
    Callback = TRUE
    SendSigs = {"TERM", "USR1", "USR2"}
    MaxSends = 3
    Fates = {"exit1", "SEGV", "KILL"}
    Checked = {"TERM"}
    ChldIgn = FALSE
    Unblocked = FALSE
    FixChld = TRUE
    FixReap = TRUE
SPECIFICATION Spec
INVARIANTS
    TypeOK
    NoLostSignal
    NoKillAfterReap
    NoKillRecycled
    ExitMirrors
    CleanupOnce
    NoUnforwardedKill
    NoOrphan
CHECK_DEADLOCK TRUE
