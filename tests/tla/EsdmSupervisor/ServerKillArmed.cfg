\* The server: SIGKILL to the supervisor between the daemon's prctl() and its privilege drop - the parent-death signal stops the daemon
CONSTANTS
    Sigs = {"TERM", "USR1", "USR2", "ABRT"}
    Fwd = {"TERM", "USR1", "USR2", "ABRT"}
    PreHandlers = {"TERM"}
    PreIgnored = {"USR1"}
    PostHandlers = {"USR1"}
    TermSigs = {"TERM"}
    Latch = TRUE
    Callback = TRUE
    SendSigs = {"TERM", "USR1", "USR2", "ABRT"}
    MaxSends = 2
    Fates = {"exit1", "SEGV", "KILL"}
    Checked = {"TERM"}
    Handled = {"USR1"}
    FwdDrops = {}
    KillAt = {"sigaction", "setuid"}
    ChldIgn = FALSE
    Unblocked = FALSE
    FixChld = TRUE
    FixReap = TRUE
SPECIFICATION Spec
INVARIANTS
    TypeOK
    NoLostSignal
    OwedInFlight
    NoKillAfterReap
    NoKillRecycled
    ExitMirrors
    CleanupOnce
    NoUnforwardedKill
    NoOrphan
    NoHang
PROPERTIES
    SupervisorExits
    OwedReaches
    StopEndsBoth
    OrphanStops
CHECK_DEADLOCK TRUE
