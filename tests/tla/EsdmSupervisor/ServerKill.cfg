\* The server: SIGKILL to the supervisor at any step of the daemon - the parent-death signal, armed again after the privilege drop, or the signal the daemon sends itself after its poll() of the lifeline stops it
CONSTANTS
    Sigs = {"TERM", "USR1", "USR2", "ABRT"}
    Fwd = {"TERM", "USR1", "USR2", "ABRT"}
    PreHandlers = {"TERM"}
    PreIgnored = {"USR1"}
    PostHandlers = {"USR1"}
    TermSigs = {"TERM"}
    Latch = TRUE
    Callback = TRUE
    SendSigs = {"TERM", "USR1", "USR2", "ABRT"}
    MaxSends = 2
    Fates = {"exit1", "SEGV", "KILL"}
    Checked = {"TERM"}
    Handled = {"USR1"}
    FwdDrops = {}
    KillAt = {"sigprocmask", "prctl", "poll", "sigaction", "setuid", "prctl2", "poll2", "serve"}
    ChldIgn = FALSE
    Unblocked = FALSE
    FixChld = TRUE
    FixReap = TRUE
    FixPdeath = TRUE
    Watch = FALSE
SPECIFICATION Spec
INVARIANTS
    TypeOK
    NoLostSignal
    OwedInFlight
    NoKillAfterReap
    NoKillRecycled
    ExitMirrors
    CleanupOnce
    NoUnforwardedKill
    NoOrphan
    NoHang
PROPERTIES
    SupervisorExits
    OwedReaches
    StopEndsBoth
    OrphanStops
CHECK_DEADLOCK TRUE
