\* CUSE: SIGKILL to the supervisor at any step of the daemon - the parent-death signal of the prefork or, from before the privilege drop on, the thread that watches the lifeline stops it
CONSTANTS
    Sigs = {"TERM", "USR1", "USR2", "ABRT"}
    Fwd = {"TERM", "USR1", "USR2", "ABRT"}
    PreHandlers = {"TERM", "USR1", "USR2"}
    PreIgnored = {}
    PostHandlers = {}
    TermSigs = {"TERM", "USR1", "USR2"}
    Latch = TRUE
    Callback = FALSE
    SendSigs = {"TERM", "USR1", "USR2", "ABRT"}
    MaxSends = 2
    Fates = {"exit1", "SEGV", "KILL"}
    Checked = {"TERM", "USR1", "USR2"}
    Handled = {}
    FwdDrops = {}
    KillAt = {"sigprocmask", "prctl", "poll", "pthread_create", "sigaction", "setuid", "serve"}
    ChldIgn = FALSE
    Unblocked = FALSE
    FixChld = TRUE
    FixReap = TRUE
    FixPdeath = TRUE
    Watch = TRUE
SPECIFICATION Spec
INVARIANTS
    TypeOK
    NoLostSignal
    OwedInFlight
    NoKillAfterReap
    NoKillRecycled
    ExitMirrors
    CleanupOnce
    NoUnforwardedKill
    NoOrphan
    NoHang
PROPERTIES
    SupervisorExits
    OwedReaches
    StopEndsBoth
    OrphanStops
CHECK_DEADLOCK TRUE
