\* Before the reap fix: a second SIGTERM after waitpid() reaped the stopped daemon is forwarded to its PID
\* Expect: NoKillAfterReap
CONSTANTS
    Sigs = {"TERM", "USR1", "USR2"}
    Fwd = {"TERM", "USR1"}
    PreHandlers = {"TERM"}
    PostHandlers = {"USR1"}
    TermSigs = {"TERM"}
    Latch = TRUE
    Callback = TRUE
    SendSigs = {"TERM"}
    MaxSends = 2
    Fates = {}
    Checked = {"TERM"}
    ChldIgn = FALSE
    Unblocked = FALSE
    FixChld = FALSE
    FixReap = FALSE
SPECIFICATION Spec
INVARIANTS
    NoKillAfterReap
CHECK_DEADLOCK TRUE
