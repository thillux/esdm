\* CUSE before the fix: a CUSE termination signal outside the forwarded set kills the supervisor, the daemon lives on
\* Expect: NoUnforwardedKill
CONSTANTS
    Sigs = {"TERM", "USR1", "USR2"}
    Fwd = {"TERM", "USR1"}
    PreHandlers = {}
    PreIgnored = {}
    PostHandlers = {"TERM", "USR1", "USR2"}
    TermSigs = {"TERM", "USR1", "USR2"}
    Latch = FALSE
    Callback = FALSE
    SendSigs = {"USR2"}
    MaxSends = 1
    Fates = {"exit1", "SEGV", "KILL"}
    Checked = {}
    Handled = {}
    FwdDrops = {}
    KillAt = {}
    ChldIgn = FALSE
    Unblocked = FALSE
    FixChld = FALSE
    FixReap = FALSE
    FixPdeath = FALSE
    Watch = FALSE
SPECIFICATION Spec
INVARIANTS
    NoUnforwardedKill
CHECK_DEADLOCK TRUE
