\* CUSE before the other catchable signals were forwarded: a SIGABRT sent to the supervisor kills it, the daemon lives on unsupervised
\* Expect: NoOrphan
CONSTANTS
    Sigs = {"TERM", "USR1", "USR2", "ABRT"}
    Fwd = {"TERM", "USR1", "USR2"}
    PreHandlers = {"TERM", "USR1", "USR2"}
    PreIgnored = {}
    PostHandlers = {}
    TermSigs = {"TERM", "USR1", "USR2"}
    Latch = TRUE
    Callback = FALSE
    SendSigs = {"ABRT"}
    MaxSends = 1
    Fates = {"exit1", "SEGV", "KILL"}
    Checked = {"TERM", "USR1", "USR2"}
    Handled = {}
    FwdDrops = {}
    KillAt = {}
    ChldIgn = FALSE
    Unblocked = FALSE
    FixChld = TRUE
    FixReap = TRUE
SPECIFICATION Spec
INVARIANTS
    NoOrphan
CHECK_DEADLOCK TRUE
