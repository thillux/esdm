    Sigs = {"TERM", "USR1", "USR2"}
    Fwd = {"TERM", "USR1"}
    PreHandlers = {"TERM"}
    PostHandlers = {"USR1"}
    TermSigs = {"TERM"}
    Latch = TRUE
    Callback = TRUE
    SendSigs = {"USR1"}
    MaxSends = 1
    Fates = {"exit1", "SEGV", "KILL"}
    Checked = {"TERM", "USR1"}
