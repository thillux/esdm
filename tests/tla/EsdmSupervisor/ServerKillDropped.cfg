\* The server: SIGKILL to the supervisor of the serving daemon - the privilege drop cleared the parent-death signal, the daemon lives on (not closed)
\* Expect: OrphanStops
CONSTANTS
    Sigs = {"TERM", "USR1", "USR2", "ABRT"}
    Fwd = {"TERM", "USR1", "USR2", "ABRT"}
    PreHandlers = {"TERM"}
    PreIgnored = {"USR1"}
    PostHandlers = {"USR1"}
    TermSigs = {"TERM"}
    Latch = TRUE
    Callback = TRUE
    SendSigs = {}
    MaxSends = 0
    Fates = {"exit1", "SEGV", "KILL"}
    Checked = {"TERM"}
    Handled = {"USR1"}
    FwdDrops = {}
    KillAt = {"serve"}
    ChldIgn = FALSE
    Unblocked = FALSE
    FixChld = TRUE
    FixReap = TRUE
SPECIFICATION Spec
CHECK_DEADLOCK TRUE
PROPERTIES
    OrphanStops
