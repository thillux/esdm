\* Before the termination set was forwarded: a stray SIGUSR2 kills the supervisor, the daemon lives on unsupervised
\* Expect: NoOrphan
CONSTANTS
    Sigs = {"TERM", "USR1", "USR2"}
    Fwd = {"TERM", "USR1"}
    PreHandlers = {"TERM"}
    PostHandlers = {"USR1"}
    TermSigs = {"TERM"}
    Latch = TRUE
    Callback = TRUE
    SendSigs = {"USR2"}
    MaxSends = 1
    Fates = {"exit1", "SEGV", "KILL"}
    Checked = {"TERM"}
    ChldIgn = FALSE
    Unblocked = FALSE
    FixChld = FALSE
    FixReap = FALSE
SPECIFICATION Spec
INVARIANTS
    NoOrphan
CHECK_DEADLOCK TRUE
