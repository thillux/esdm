\* The limit of the stop request: a request that read the stop flag before esdm_fini() set it starts the worker after
\* the join; the worker leaves without a pass (LateWorkerIdle in Fini)
\* Expect: NoStartAfterJoin
CONSTANTS
    Req = {"r1"}
    Chunks = 1
    MaxReq = 1
    Blocking = FALSE
    SeedCallers = {}
    OnDemand = {}
    InitMonitor = FALSE
    SeedAtInit = TRUE
    Reseeder = FALSE
    MaxReseeds = 0
    Reinit = FALSE
    Fini = TRUE
    CanBreak = FALSE
    Threads = TRUE
    ThreadFail = FALSE
    GateEachChunk = TRUE
    RecheckChunk = TRUE
    GateSeeding = TRUE
    WaitGate = TRUE
    FiniGate = TRUE
    EsLocked = TRUE
    defaultInitValue = 0
SPECIFICATION Spec
INVARIANTS
    NoStartAfterJoin
