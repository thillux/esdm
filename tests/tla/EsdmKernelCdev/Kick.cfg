\* A blocking and a non-blocking reader of /dev/esdm_random: clearing the flag kicks the watcher while somebody waits
\* Slow
CONSTANTS
    Readers = {"rb", "rn"}
    Pollers = {}
    MaxReads = 1
    MaxPolls = 0
    MaxSig = 0
    AllocFail = FALSE
    KickOnUnset = TRUE
    AllocBackoff = TRUE
    SleepFix = TRUE
    defaultInitValue = "undef"
SPECIFICATION Spec
INVARIANTS
    TypeOK
    ReadResult
    RestartSignal
    PrBackoff
    WaitersCount
    WaitQueue
    NoLostWakeup
PROPERTIES
    ReadsReturn
    WatcherStops
