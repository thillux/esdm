\* A blocking and a non-blocking reader of /dev/esdm_random: clearing the flag kicks the watcher while somebody waits
\* Slow
CONSTANTS
    Readers = {"rb", "rn"}
    Pollers = {}
    MaxReads = 1
    MaxPolls = 0
    MaxSig = 0
    Liveness = TRUE
    KickOnUnset = TRUE
    defaultInitValue = "undef"
SPECIFICATION Spec
INVARIANTS
    TypeOK
    ReadResult
    PrBackoff
    WaitersCount
    NoLostWakeup
PROPERTIES
    ReadsReturn
    PollsReturn
CHECK_DEADLOCK FALSE
