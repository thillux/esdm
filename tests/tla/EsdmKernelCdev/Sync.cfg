\* A non-blocking reader of /dev/esdm_random with O_SYNC next to a poller of /dev/esdm_pr: the back-off is shared
CONSTANTS
    Readers = {"sn"}
    Pollers = {"pp"}
    MaxReads = 1
    MaxPolls = 1
    MaxSig = 1
    AllocFail = FALSE
    KickOnUnset = TRUE
    AllocBackoff = TRUE
    SleepFix = TRUE
    defaultInitValue = "undef"
SPECIFICATION Spec
INVARIANTS
    TypeOK
    ReadResult
    RestartSignal
    PrBackoff
    WaitersCount
    WaitQueue
    NoLostWakeup
PROPERTIES
    ReadsReturn
    PollsReturn
    WatcherStops
