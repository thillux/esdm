\* As Hang, without the invariant and the deadlock check: the read does not return
\* Expect: ReadsReturn
\* Slow
CONSTANTS
    Readers = {"rb", "rn"}
    Pollers = {}
    MaxReads = 1
    MaxPolls = 0
    MaxSig = 0
    AllocFail = FALSE
    KickOnUnset = FALSE
    AllocBackoff = TRUE
    SleepFix = TRUE
    defaultInitValue = "undef"
SPECIFICATION Spec
\* Off to show that the liveness property finds the hang by itself
CHECK_DEADLOCK FALSE
INVARIANTS
    TypeOK
    ReadResult
    RestartSignal
    PrBackoff
    WaitersCount
    WaitQueue
PROPERTIES
    ReadsReturn
