\* A blocking reader of /dev/esdm_pr sleeps for the rest and is woken early, a signal, no memory
CONSTANTS
    Readers = {"pb"}
    Pollers = {}
    MaxReads = 1
    MaxPolls = 0
    MaxSig = 1
    AllocFail = TRUE
    KickOnUnset = TRUE
    AllocBackoff = TRUE
    SleepFix = TRUE
    defaultInitValue = "undef"
SPECIFICATION Spec
INVARIANTS
    TypeOK
    ReadResult
    RestartSignal
    PrBackoff
    WaitersCount
    WaitQueue
    NoLostWakeup
PROPERTIES
    ReadsReturn
    SignalEnds
    WatcherStops
