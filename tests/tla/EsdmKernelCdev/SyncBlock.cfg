\* Blocking and non-blocking readers of /dev/esdm_random with O_SYNC, a signal
\* Slow
CONSTANTS
    Readers = {"sb", "sn"}
    Pollers = {}
    MaxReads = 1
    MaxPolls = 0
    MaxSig = 1
    AllocFail = FALSE
    KickOnUnset = TRUE
    AllocBackoff = TRUE
    SleepFix = TRUE
    defaultInitValue = "undef"
SPECIFICATION Spec
INVARIANTS
    TypeOK
    ReadResult
    RestartSignal
    PrBackoff
    WaitersCount
    WaitQueue
    NoLostWakeup
PROPERTIES
    ReadsReturn
    SignalEnds
    WatcherStops
