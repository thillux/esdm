\* Four tasks on two connections: a connection freed behind the scan of another task, a signal
\* The clients are model values, the readers a symmetry set
CONSTANTS
    t1 = t1
    t2 = t2
    t3 = t3
    t4 = t4
    Clients = {t1, t2, t3, t4}
    PrivClients = {}
    NC = 2
    MaxWorks = 1
    MaxCalls = 1
    MaxSig = 1
    MaxFaults = 0
    Liveness = TRUE
    InitConn = TRUE
    PassOn = TRUE
    Locked = TRUE
    Drop = TRUE
    Commit = TRUE
    Await = TRUE
    Finish = TRUE
    Release = TRUE
    WakeNext = FALSE
    defaultInitValue = "undef"
SYMMETRY Sym
SPECIFICATION Spec
INVARIANTS
    TypeOK
    ResponseMatch
    ExclusiveUse
    NoSockLeak
    NoStaleEntry
    NoStrandedWaiter
    NoSleeperByIdlePool
