\* A privileged command next to a reader: never carried out twice, whatever the ESDM closes or restarts
\* Slow
CONSTANTS
    Clients = {"t1", "t2"}
    PrivClients = {"t2"}
    NC = 1
    MaxWorks = 2
    MaxCalls = 1
    MaxSig = 1
    MaxFaults = 2
    Liveness = TRUE
    InitConn = FALSE
    PassOn = TRUE
    Locked = TRUE
    Drop = TRUE
    Commit = TRUE
    Await = TRUE
    Finish = TRUE
    Release = TRUE
    WakeNext = FALSE
    defaultInitValue = "undef"
SPECIFICATION Spec
INVARIANTS
    TypeOK
    ResponseMatch
    SentOnce
    AnswerAwaited
    ExclusiveUse
    NoSockLeak
    NoStaleEntry
    NoStrandedWaiter
    NoSleeperByIdlePool
    NoSleeperByFreeConn
