\* A privileged command next to a reader: never sent twice, whatever the ESDM closes or restarts
\* Slow
CONSTANTS
    Clients = {"t1", "t2"}
    PrivClients = {"t2"}
    NC = 1
    MaxWorks = 2
    MaxCalls = 1
    MaxSig = 1
    MaxFaults = 2
    Liveness = TRUE
    InitConn = FALSE
    PassOn = TRUE
    defaultInitValue = "undef"
SPECIFICATION Spec
INVARIANTS
    TypeOK
    ResponseMatch
    SentOnce
    ExclusiveUse
    NoSockLeak
    NoStrandedWaiter
    NoSleeperByFreeConn
CHECK_DEADLOCK FALSE
