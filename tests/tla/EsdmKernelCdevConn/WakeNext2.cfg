\* Not the code: a waiter that leaves with a connection wakes the next one. No task then sleeps by a free
\* connection, also with two connections (see ScanRace)
\* The clients are model values, the readers a symmetry set
CONSTANTS
    t1 = t1
    t2 = t2
    t3 = t3
    t4 = t4
    Clients = {t1, t2, t3, t4}
    PrivClients = {}
    NC = 2
    MaxWorks = 1
    MaxCalls = 1
    MaxSig = 1
    MaxFaults = 0
    Liveness = TRUE
    InitConn = TRUE
    PassOn = TRUE
    Locked = TRUE
    Drop = TRUE
    Commit = TRUE
    Await = TRUE
    Finish = TRUE
    Release = TRUE
    WakeNext = TRUE
    defaultInitValue = "undef"
SYMMETRY Sym
SPECIFICATION Spec
INVARIANTS
    TypeOK
    ResponseMatch
    ExclusiveUse
    NoSockLeak
    NoStaleEntry
    NoStrandedWaiter
    NoSleeperByIdlePool
    NoSleeperByFreeConn
