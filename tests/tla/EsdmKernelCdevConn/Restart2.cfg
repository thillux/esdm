\* Two readers on two connections: the ESDM restarts, closes a connection or a wait times out
\* The clients are model values, the readers a symmetry set
CONSTANTS
    t1 = t1
    t2 = t2
    Clients = {t1, t2}
    PrivClients = {}
    NC = 2
    MaxWorks = 2
    MaxCalls = 1
    MaxSig = 0
    MaxFaults = 1
    Liveness = TRUE
    InitConn = FALSE
    PassOn = TRUE
    Locked = TRUE
    Drop = TRUE
    Commit = TRUE
    Await = TRUE
    Finish = TRUE
    Release = TRUE
    WakeNext = FALSE
    defaultInitValue = "undef"
SYMMETRY Sym
SPECIFICATION Spec
INVARIANTS
    TypeOK
    ResponseMatch
    ExclusiveUse
    NoSockLeak
    NoStaleEntry
    NoStrandedWaiter
    NoSleeperByIdlePool
