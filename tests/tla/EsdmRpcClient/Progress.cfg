    NC = 1
    Kinds = {"nb", "full"}
    Sizes = {1}
    MaxCalls = 1
    Endless = FALSE
    MaxRounds = 1
    Slices = 1
    Drops = TRUE
    Closes = TRUE
    MaxRestarts = 0
    Interrupts = FALSE
    Sticky = TRUE
    InvokeRetry = 0
    MaxDeaths = 0
    Fini = FALSE
    Heal = FALSE
    ReadErr = FALSE
    ResetOnErr = TRUE
    IntrUnknown = TRUE
    TimedGet = TRUE
    Hog = FALSE
    NoReset = FALSE
    NoOwnerDeadReset = FALSE
    Robust = TRUE
