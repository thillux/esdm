\* One-shot interrupts and the _full_timeout deadline, two receive slices, the server drops and closes
\* Slow
CONSTANTS
    Threads = {"t1", "t2"}
    NC = 1
    Kinds = {"timeout", "full", "nb"}
    Sizes = {1}
    MaxCalls = 1
    MaxRounds = 1
    Slices = 2
    Drops = TRUE
    Closes = TRUE
    MaxRestarts = 0
    Interrupts = TRUE
    Sticky = FALSE
    InvokeRetry = 0
    MaxDeaths = 0
    Fini = FALSE
    Heal = TRUE
    ReadErr = FALSE
    ResetOnErr = TRUE
    IntrUnknown = TRUE
    TimedGet = TRUE
    Hog = FALSE
    NoReset = FALSE
    NoOwnerDeadReset = FALSE
    defaultInitValue = "undef"
SPECIFICATION Spec
INVARIANTS
    TypeOK
    ResponseMatch
    ExclusiveUse
    NoUseAfterClose
    NoLockLeak
    BlockingNoEagain
    NoblockNoWait
    GoodCallsSucceed
    DeadlineNoWait
CHECK_DEADLOCK TRUE
