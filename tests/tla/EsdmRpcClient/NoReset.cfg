\* Mutation: the socket of a request given up on is kept, the classic desynchronization
\* Expect: ResponseMatch
CONSTANTS
    Threads = {"t1", "t2"}
    NC = 1
    Kinds = {"nb", "full", "fullnb"}
    Sizes = {1}
    MaxCalls = 1
    MaxRounds = 1
    Slices = 1
    Drops = TRUE
    Closes = FALSE
    MaxRestarts = 0
    Interrupts = FALSE
    Sticky = TRUE
    InvokeRetry = 0
    MaxDeaths = 0
    Fini = FALSE
    Heal = TRUE
    ReadErr = FALSE
    ResetOnErr = TRUE
    IntrUnknown = TRUE
    TimedGet = TRUE
    Hog = FALSE
    NoReset = TRUE
    NoOwnerDeadReset = FALSE
    defaultInitValue = "undef"
SPECIFICATION Spec
INVARIANTS
    TypeOK
    ResponseMatch
    ExclusiveUse
    NoUseAfterClose
    NoLockLeak
    BlockingNoEagain
    NoblockNoWait
    GoodCallsSucceed
CHECK_DEADLOCK TRUE
