\* A _full_timeout call returns once its deadline passed, while the server answers -EAGAIN, drops, closes, never heals
\* Slow
CONSTANTS
    Threads = {"t1", "t2"}
    NC = 1
    Kinds = {"timeout", "full"}
    Sizes = {1}
    MaxCalls = 1
    MaxRounds = 1
    Slices = 1
    Drops = TRUE
    Closes = TRUE
    MaxRestarts = 0
    Interrupts = FALSE
    Sticky = TRUE
    InvokeRetry = 0
    MaxDeaths = 0
    Fini = FALSE
    Heal = FALSE
    ReadErr = FALSE
    ResetOnErr = TRUE
    IntrUnknown = TRUE
    TimedGet = TRUE
    Hog = FALSE
    NoReset = FALSE
    NoOwnerDeadReset = FALSE
    defaultInitValue = "undef"
SPECIFICATION Spec
PROPERTIES
    DeadlineReturns
INVARIANTS
    DeadlineNoWait
CHECK_DEADLOCK FALSE
