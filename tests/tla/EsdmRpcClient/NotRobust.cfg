\* Mutation: plain mutexes, a thread cancelled in read() keeps ref_cnt and the lock for good and the next caller hangs
\* Expect: Deadlock
CONSTANTS
    Threads = {"t1", "t2"}
    NC = 1
    Kinds = {"nb", "full"}
    Sizes = {1}
    MaxCalls = 1
    Endless = FALSE
    MaxRounds = 1
    Slices = 1
    Drops = FALSE
    Closes = FALSE
    MaxRestarts = 0
    Interrupts = FALSE
    Sticky = TRUE
    InvokeRetry = 0
    MaxDeaths = 1
    Fini = FALSE
    Heal = FALSE
    ReadErr = FALSE
    ResetOnErr = TRUE
    IntrUnknown = TRUE
    TimedGet = TRUE
    Hog = FALSE
    NoReset = FALSE
    NoOwnerDeadReset = FALSE
    Robust = FALSE
    MaxExtra = 0
    CheckId = TRUE
    defaultInitValue = "undef"
SPECIFICATION Spec
INVARIANTS
    TypeOK
    ResponseMatch
    ExclusiveUse
    NoUseAfterClose
    NoLockLeak
    BlockingNoEagain
    NoblockNoWait
    GoodCallsSucceed
CHECK_DEADLOCK TRUE
