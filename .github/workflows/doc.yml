name: Documentation

# The design document and the slide deck from their Typst sources in
# doc/typst (nix build .#esdm-doc): the PDFs are the artifact esdm-doc of
# the run.

on:
  push:
    branches: [ master ]
    paths:
      - 'doc/**'
      - flake.nix
      - flake.lock
      - .github/workflows/doc.yml
  pull_request:
    paths:
      - 'doc/**'
      - flake.nix
      - flake.lock
      - .github/workflows/doc.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  doc:
    name: design document and slide deck
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      # With typst on PATH they also compile every merge they make.
      - name: Test typstdiff
        run: |
          nix develop .#doc -c python3 -m unittest discover -s doc/tools -v

      - name: Build the documentation
        if: ${{ !cancelled() }}
        run: |
          nix build --print-build-logs .#esdm-doc
          mkdir -p out
          cp result/share/doc/esdm/*.pdf out/

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: esdm-doc
          path: out/*.pdf
          if-no-files-found: error
