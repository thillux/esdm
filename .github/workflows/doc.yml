name: Documentation

# Builds the design document, the slide deck and the poster from their Typst
# sources in doc/typst (nix build .#esdm-doc) and checks the identifiers they
# name. Nothing is uploaded.

on:
  push:
    branches: [ master ]
    paths:
      - 'doc/**'
      - flake.nix
      - flake.lock
      - .github/workflows/doc.yml
  pull_request:
    paths:
      - 'doc/**'
      - flake.nix
      - flake.lock
      - .github/workflows/doc.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  doc:
    name: design document and slide deck
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      # With typst on PATH they also compile every merge they make.
      - name: Test typstdiff
        run: |
          nix develop .#doc -c python3 -m unittest discover -s doc/tools -v

      # Needs the whole tree, which the nix build of the documentation
      # does not get.
      - name: Check the identifiers the documentation names
        run: |
          nix develop .#doc -c python3 doc/tools/check_identifiers.py

      - name: Check that the option reference is current
        run: |
          nix develop .#doc -c python3 doc/tools/gen_meson_options.py --check

      - name: Build the documentation
        if: ${{ !cancelled() }}
        run: |
          nix build --print-build-logs .#esdm-doc
